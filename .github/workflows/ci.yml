name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LeftoverScout.slnx

      - name: Build (warnings are errors)
        run: dotnet build LeftoverScout.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LeftoverScout.slnx --configuration Release --no-build
